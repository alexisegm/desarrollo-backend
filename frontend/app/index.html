<!-- frontend/app/index.html -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Solicitudes — /app</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <strong>Solicitudes</strong>
    <div id="session-box" class="session-box">
      <span id="session-user" class="session-user">Sin sesión</span>
      <button id="logout-btn" hidden type="button">Salir</button>
    </div>
  </header>

  <main class="layout">
    <section id="auth-panel" class="panel">
      <h2>Entrar</h2>
      <form id="login-form" class="stack">
        <label>Email <input name="email" type="email" required autocomplete="username"></label>
        <label>Password <input name="password" type="password" required minlength="15" maxlength="128" autocomplete="current-password"></label>
        <button type="submit">Iniciar sesión</button>
      </form>
      
      <hr style="margin: 20px 0; border-color: #2a2f3d;">

      <h2>Registrarse</h2>
      <form id="register-form" class="stack">
        <label>Nombre <input name="name" type="text" required></label>
        <label>Email <input name="email" type="email" required autocomplete="username"></label>
        <label>Password <input name="password" type="password" required minlength="15" maxlength="128" autocomplete="new-password"></label>
        <button type="submit">Crear cuenta</button>
      </form>

      <p id="auth-feedback" class="feedback" role="status"></p>
    </section>

    <section id="requests-panel" class="panel" hidden>
      <h2>Mis solicitudes</h2>
      <form id="create-request-form" class="stack" style="margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid #2a2f3d;">
        <label>Título <input name="title" type="text" required></label>
        <label>Descripción <textarea name="description" required style="width: 100%; padding: 0.5rem; background: #161923; color: #e8eaf0; border: 1px solid #2a2f3d; border-radius: 4px; min-height: 80px;"></textarea></label>
        <button type="submit">Crear solicitud</button>
      </form>
      <!-- Filtros -->
      <div id="filters-container" style="display: flex; gap: 1rem; margin-bottom: 1.5rem; align-items: center;">
        <select id="filter-status" style="padding: 0.5rem; background: #161923; color: #e8eaf0; border: 1px solid #2a2f3d; border-radius: 4px;">
          <option value="">Cualquier estado</option>
          <option value="open">Open</option>
          <option value="in_progress">In Progress</option>
          <option value="resolved">Resolved</option>
          <option value="closed">Closed</option>
        </select>

        <select id="filter-priority" style="padding: 0.5rem; background: #161923; color: #e8eaf0; border: 1px solid #2a2f3d; border-radius: 4px;">
          <option value="">Cualquier prioridad</option>
          <option value="low">Low</option>
          <option value="medium">Medium</option>
          <option value="high">High</option>
        </select>

        <button id="apply-filters-btn" type="button" style="padding: 0.5rem 1rem; flex-shrink: 0;">Aplicar filtros</button>
      </div>
      <p id="requests-state" class="feedback" role="status">Cargando solicitudes...</p>
      <ul id="requests-list" class="request-list"></ul>
    </section>
    <!-- Panel de Detalle de Solicitud -->
    <section id="request-detail-panel" class="panel" hidden>
      <button id="back-to-list-btn" style="margin-bottom: 1rem; background: #2a2f3d; color: white; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer;">&larr; Volver a la lista</button>
      
      <div style="display: flex; justify-content: space-between; align-items: center;">
          <h2>Detalle de Solicitud</h2>
          <span id="detail-status-badge" style="font-size: 0.9rem; padding: 0.3rem 0.8rem; border-radius: 12px; background: #3d2a2f;"></span>
      </div>

      <form id="edit-request-form" class="stack" style="margin-top: 1rem; padding-bottom: 1rem; border-bottom: 1px solid #2a2f3d;">
        <input type="hidden" id="edit-request-id">
        <label>Título <input name="title" id="edit-title" type="text" required></label>
        <label>Descripción <textarea name="description" id="edit-description" required style="width: 100%; padding: 0.5rem; background: #161923; color: #e8eaf0; border: 1px solid #2a2f3d; border-radius: 4px; min-height: 80px;"></textarea></label>
        
        <button type="submit" id="update-request-btn">Guardar Cambios</button>
        <p id="edit-warning" style="color: #ff6b6b; font-size: 0.85rem; margin-top: 0.5rem;" hidden>Esta solicitud ya no puede ser editada porque su estado cambió.</p>
      </form>

      <h3 style="margin-top: 2rem; color: #a0a5b5;">Historial de Cambios</h3>
      <ul id="request-history-list" class="request-list"></ul>
    </section>
  </main>

  <script type="module" src="./main.js"></script>
</body>
</html>
